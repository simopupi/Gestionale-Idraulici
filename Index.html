<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IdroQuick Pro - Scheda Intervento</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #eff6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; padding: 20px 12px; min-height: 100vh; }
    .app-container { width: 100%; max-width: 440px; background: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--border); padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; }
    .header { text-align: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .header-badge { display: inline-block; background: var(--accent); color: var(--primary); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; padding: 4px 10px; border-radius: 12px; margin-bottom: 6px; }
    .header h1 { font-size: 22px; font-weight: 800; color: var(--text-main); }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; height: 48px; padding: 0 14px; background: #f1f5f9; border: 1px solid transparent; border-radius: 12px; font-size: 15px; color: var(--text-main); outline: none; transition: all 0.2s ease; }
    input:focus, select:focus { background: #ffffff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    .quick-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .btn-quick { height: 40px; background: var(--accent); color: var(--primary); border: 1px solid #dbeafe; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
    .btn-quick:active { transform: scale(0.97); background: #dbeafe; }
    .canvas-container { position: relative; border: 2px dashed var(--border); border-radius: 14px; background: #fafafa; overflow: hidden; }
    canvas { width: 100%; height: 130px; display: block; touch-action: none; cursor: crosshair; }
    .btn-clear { position: absolute; top: 8px; right: 8px; background: rgba(255, 255, 255, 0.9); border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
    .btn-submit { width: 100%; height: 54px; background: var(--primary); color: #ffffff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); transition: all 0.2s ease; margin-top: 8px; }
    .btn-submit:active { transform: scale(0.98); background: var(--primary-hover); }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <span class="header-badge">Work Order App</span>
    <h1>🔧 Scheda Intervento</h1>
  </div>

  <div class="form-group">
    <label for="cliente">Nome Cliente</label>
    <input type="text" id="cliente" placeholder="es. Mario Rossi">
  </div>

  <div class="form-group">
    <label for="telefono">Cellulare (WhatsApp)</label>
    <input type="tel" id="telefono" placeholder="333 1234567">
  </div>

  <div class="form-group">
    <label for="tipo">Tipo Intervento</label>
    <select id="tipo">
      <option>Sostituzione Caldaia / Scaldabagno</option>
      <option>Riparazione Perdita Bagno/Cucina</option>
      <option>Disostruzione Scarico</option>
      <option>Installazione Rubinetteria</option>
      <option>Manutenzione Ordinaria</option>
    </select>
  </div>

  <div class="form-group">
    <label>Aggiungi Cifra Rapida</label>
    <div class="quick-buttons">
      <button type="button" class="btn-quick" onclick="addPrezzo(40)">+ Chiamata (40€)</button>
      <button type="button" class="btn-quick" onclick="addPrezzo(35)">+ 1 Ora (35€)</button>
    </div>
  </div>

  <div class="form-group">
    <label for="totale">Importo Totale (€)</label>
    <input type="number" id="totale" value="0">
  </div>

  <div class="form-group">
    <label>Firma Cliente</label>
    <div class="canvas-container">
      <canvas id="signature-pad"></canvas>
      <button type="button" class="btn-clear" onclick="clearCanvas()">Pulisci</button>
    </div>
  </div>

  <button type="button" class="btn-submit" onclick="inviaWhatsApp()">
    <span>📱 Conferma & Invia su WhatsApp</span>
  </button>
</div>

<script>
  const canvas = document.getElementById('signature-pad');
  const ctx = canvas.getContext('2d');
  let drawing = false;

  function initCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = 130;
  }
  window.addEventListener('load', initCanvas);
  window.addEventListener('resize', initCanvas);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDrawing(e) { drawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }
  function stopDrawing() { drawing = false; }
  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#0f172a';
    ctx.lineTo(pos.x, pos.y); ctx.stroke();
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('touchstart', startDrawing);
  canvas.addEventListener('touchend', stopDrawing);
  canvas.addEventListener('touchmove', draw);

  function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
  function addPrezzo(valore) {
    const el = document.getElementById('totale');
    el.value = parseFloat(el.value || 0) + valore;
  }
  function inviaWhatsApp() {
    const cliente = document.getElementById('cliente').value || 'Cliente';
    const tel = document.getElementById('telefono').value.replace(/\s+/g, '');
    const tipo = document.getElementById('tipo').value;
    const totale = document.getElementById('totale').value;
    const testo = `Ciao ${cliente}, ti confermo il lavoro per: *${tipo}*.\nTotale concordato: *${totale}€*.\nGrazie e a presto!`;
    window.open(`https://wa.me/${tel}?text=${encodeURIComponent(testo)}`, '_blank');
  }
</script>
</body>
</html>
